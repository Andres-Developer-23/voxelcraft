<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoxelCraft — aprende Python jugando</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <p><strong>WASD</strong> moverse · <strong>Espacio</strong> saltar ·
      <strong>clic izq.</strong> picar · <strong>clic der.</strong> colocar ·
      <strong>1-4</strong> elegir bloque</p>
      <p id="bloque-actual">Bloque: ladrillo</p>
      <p id="aviso">Clic en la pantalla para empezar</p>
    </div>

    <aside id="panel">
      <h1>VoxelCraft</h1>
      <section id="mision">
        <div class="mision-cabecera">
          <h2 id="mision-titulo">Editor de Python</h2>
          <span id="mision-progreso"></span>
        </div>
        <p id="mision-desc"></p>
      </section>
      <textarea id="codigo" spellcheck="false" autocomplete="off"></textarea>
      <div class="acciones">
        <button id="ejecutar">▶ Ejecutar</button>
        <button id="reiniciar">↺ Reiniciar</button>
        <button id="siguiente" hidden>Siguiente ▶</button>
        <span id="estado-mision" class="pendiente">Misión: pendiente</span>
      </div>
      <pre id="consola"></pre>
    </aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
